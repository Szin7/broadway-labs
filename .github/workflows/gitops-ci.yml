
name: GitOps CI - Validate and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -summary \
            day10/kubernetes/k8s_file/django-deployment.yaml \
            day10/kubernetes/k8s_file/django-service.yaml \
            day10/kubernetes/k8s_file/postgres-deployment.yaml \
            day10/kubernetes/k8s_file/postgres-service.yaml \
            day10/kubernetes/k8s_file/ingress.yaml
flask-gitops/manifests/*.yaml

  docker-build:
    name: Build Day 1 Flask image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile day1/web/app.py
      - name: Run Flask unit tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r day1/web/requirements.txt
          .venv/bin/python -m unittest discover -s day1/web -p 'test_*.py' -v

      - name: Build Docker image
        run: |
          docker build \
            -f day1/web/Dockerfile \
            -t broadway-day1-flask:ci \
            day1/web

  publish-flask:
    name: Publish Flask image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate-kubernetes, docker-build]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./day1/web
          file: ./day1/web/Dockerfile
          push: true
          tags: |
            ghcr.io/szin7/broadway-day1-flask:latest
            ghcr.io/szin7/broadway-day1-flask:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Szin7/broadway-labs

      - name: Update GitOps manifest with published image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("flask-gitops/manifests/flask-deployment.yaml")
          original = path.read_text()
          image = "ghcr.io/szin7/broadway-day1-flask:" + os.environ["IMAGE_TAG"]

          updated, count = re.subn(
              r"(?m)^([ \t]*image:[ \t]*)ghcr\.io/szin7/broadway-day1-flask:[^\r\n]+",
              lambda match: match.group(1) + image,
              original,
          )

          if count != 1:
              raise SystemExit(f"Expected one Flask image; found {count}")

          path.write_text(updated)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flask-gitops/manifests/flask-deployment.yaml

          if git diff --cached --quiet; then
            echo "Image tag already matches."
            exit 0
          fi

          git commit -m "ci: deploy Flask image ${IMAGE_TAG}"
          git push origin HEAD:main
